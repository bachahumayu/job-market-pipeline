version: "3.9"
services:
  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow
    restart: always
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: 50000          # Set UID to match container user
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags           # Your DAG folder
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Humayun --lastname Safi --role Admin --email admin@example.com --password admin || true &&
               airflow webserver"
